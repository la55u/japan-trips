# --- search scope ---
[search]
origins = ["BUD", "VIE"]
destinations = ["TYO", "OSA"]
date_start = "2027-03-22"
date_end = "2027-05-31"
trip_min_days = 12
trip_max_days = 16
max_stops = 2
checked_bags = 1
adults = 2
step_days = 1

# --- estimated transfer costs, per person, EUR ---
[costs]
shinkansen_eur = 90.0      # Tokyo <-> Osaka, Nozomi reserved seat
domestic_flight_eur = 65.0 # Tokyo <-> Osaka LCC one-way
flixbus_eur = 15.0         # Budapest <-> Vienna, per direction

[currency]
huf_per_eur = 395.0
eur_per_gbp = 1.17

[skyscanner]
enabled = true
# Browser sessions are spaced at least this many hours apart; which combos
# get checked is decided per-combination from skyscanner_attempts refresh
# times, not by this global cadence.
min_age_hours = 3
# True multi-city (open-jaw) Skyscanner searches: outbound home->in_city,
# return out_city->home, priced as ONE multi-city query. Adds an OJ universe
# (~2840 combos) to exploration; OJ rows rank as "Open jaw · OTA".
oj_enabled = true
# Tiers per run: hot = refresh stored winners; neighbour = +/-1..3-day shifts
# around stored deals that beat Google by >100 EUR (RT only); exploration =
# unseen pairs first, then oldest successful check, balanced across routes
# and trip durations (Travelpayouts calendar pairs, when configured, jump the
# queue). RT and OJ exploration quotas are separate.
hot_combos = 15
neighbour_combos = 10
explore_combos = 25
explore_oj_combos = 10
# Hot winners are refreshed once older than this (hours)...
hot_refresh_hours = 18
# ...exploration pairs once older than this (hours; 5 days).
explore_refresh_hours = 120
# Deals accepted into the ranking per checked pair.
eligible_deals = 5
# Deals to keep per combo from the Skyscanner response.
top_deals = 10
# Stored deals older than indicative_after_hours stay visible but are flagged
# "indicative"; deals older than max_age_hours drop out of the ranking.
indicative_after_hours = 24
max_age_hours = 168
# Re-bootstrap the browser session every N fast in-page API queries.
fast_rebootstrap = 6
currency = "HUF"
# Conservative round-trip checked-bag allowance added per person before OTA
# fares enter the merged ranking (raw fare also shown separately).
checked_bag_estimate_eur = 120

# Optional discovery booster: Travelpayouts Data API (cached calendar prices).
# Used ONLY to prioritize which Skyscanner exploration pairs get checked —
# cached prices are never shown or ranked. Free token: travelpayouts.com.
[travelpayouts]
enabled = false
token = ""

[cache]
# Local runs write here (gitignored). CI scans use the repo-owned flights.db
# via --db flights.db - keep them separate so neither overwrites the other.
db = "flights_local.db"
ttl_hours = 4
# Never publish a Google fare older than this, even if scans fall behind.
max_rank_age_hours = 12

[history]
retention_days = 180

[scan]
workers = 2
requests_per_second = 2.0
top_n = 40
history_top_n = 6

[ranking]
# Exclude itineraries with any known leg longer than this. Set to 0 to disable.
max_leg_hours = 30
# OTA deals with legs longer than max_leg_hours are still stored and rendered
# (durations show red) so they can be found by loosening the browser's
# max-leg filter; Google rows stay capped at max_leg_hours.
max_leg_hours_display = 48
# Default value of the browser-side "Max leg h" filter.
max_leg_filter_hours = 24
