name: scan

on:
  schedule:
    - cron: "0 3,9,15,21 * * *" # 05:00, 11:00, 17:00, 23:00 Budapest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan next batch of stale queries
        run: python flight_search.py --limit 400

      - name: Commit updated results and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.html flights.db
          git diff --cached --quiet || git commit -m "scan: refresh results and cache"
          git push
