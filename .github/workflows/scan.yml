name: scan

on:
  schedule:
    - cron: "0 * * * *" # hourly (Budapest time = UTC+1/+2)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan next batch of stale queries
        run: python flight_search.py --limit 450 --db flights.db --out results.html

      - name: Commit updated results and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.html flights.db
          git diff --cached --quiet || git commit -m "scan: refresh results and cache"
          if ! git pull --rebase origin main; then
            echo "::warning::rebase conflict on data files - keeping remote state, this run's rows will be refetched next scan"
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
          fi
          git push
