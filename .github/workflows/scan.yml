name: scan

on:
  schedule:
    - cron: "23 * * * *" # hourly at :23 (off-peak minute; top-of-hour crons get delayed/skipped)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify code
        run: |
          python -m ruff check flight_search.py watchdog.py test_flight_search.py test_watchdog.py
          python -m unittest -v

      - name: Fetch camoufox browser
        run: python -m camoufox fetch

      - name: Wait for other scan runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep $((RANDOM % 30))
          for i in $(seq 1 10); do
            active=$(gh run list --workflow scan.yml --status in_progress \
              --json databaseId \
              --jq "[.[] | select(.databaseId != $RUN_ID)] | length")
            if [ "$active" = "0" ]; then
              echo "no other scan run in progress"
              exit 0
            fi
            echo "another scan run is in progress; waiting (${i}/10)"
            sleep 60
          done
          echo "::error::another scan run still in progress after 10 minutes - aborting to avoid a flights.db rebase conflict"
          exit 1

      - name: Scan next batch of stale queries
        run: python flight_search.py --limit 450 --db flights.db --out results.html

      - name: Commit updated results and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.html flights.db
          git diff --cached --quiet || git commit -m "scan: refresh results and cache"
          if ! git pull --rebase origin main; then
            echo "::error::rebase conflict on CI-owned data files; refusing to silently discard this scan"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          git push
